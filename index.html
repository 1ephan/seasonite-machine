<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>調味石推薦助手</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
    }
    h2 {
      margin-top: 24px;
      margin-bottom: 8px;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .stat-item {
      padding: 8px 12px;
      border-radius: 6px;
      background: #f7f7f7;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
      margin-bottom: 8px;
    }
    button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
      background: white;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    .recommendation {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      background: #eef7ff;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 8px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 6px 8px;
      text-align: center;
      font-size: 0.9rem;
    }
    th {
      background: #f0f0f0;
    }
    .log {
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.9rem;
      background: #fafafa;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #eee;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 0.7rem;
      margin-left: 4px;
      color: white;
    }
    .badge-epic { background: #8b5cf6; }       /* 史詩 */
    .badge-ssr { background: #f97316; }        /* 超級稀有 */
    .badge-rare { background: #3b82f6; }       /* 稀有 */
  </style>
</head>
<body>
  <h1>敲調味石推薦小助手</h1>
  <p style="text-align:center; font-size:0.9rem;">
    目標：在 8 次加工內盡量落在 <strong>15 格</strong>（史詩），其次是 <strong>10~12 格</strong>（超級稀有）
  </p>

  <div class="card">
    <h2>目前狀態</h2>
    <div class="stats">
      <div class="stat-item">目前格子：<span id="pos">0</span></div>
      <div class="stat-item">已加工次數：<span id="steps">0</span> / 8</div>
      <div class="stat-item">剩餘 -3~+2 次數（B）：<span id="bLeft">3</span></div>
      <div class="stat-item">剩餘 +0~+4 次數（C）：<span id="cLeft">3</span></div>
      <div class="stat-item">目前結果：<span id="currentTier">尚未結算</span></div>
    </div>

    <div class="buttons">
      <button id="btnA">按鈕 A：+3 ~ +6（無限）</button>
      <button id="btnB">按鈕 B：-3 ~ +2（最多 3 次）</button>
      <button id="btnC">按鈕 C：+0 ~ +4（最多 3 次）</button>
      <button id="resetBtn">重置遊戲</button>
    </div>

    <div class="recommendation" id="recommendation">
      讀取中...
    </div>

    <table>
      <thead>
        <tr>
          <th>按鈕</th>
          <th>史詩 (15 格)</th>
          <th>超級稀有 (10~12 格)</th>
          <th>其他 / 爆炸 (稀有)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>A：+3~+6</td>
          <td id="probA_epic">-</td>
          <td id="probA_ssr">-</td>
          <td id="probA_rare">-</td>
        </tr>
        <tr>
          <td>B：-3~+2</td>
          <td id="probB_epic">-</td>
          <td id="probB_ssr">-</td>
          <td id="probB_rare">-</td>
        </tr>
        <tr>
          <td>C：+0~+4</td>
          <td id="probC_epic">-</td>
          <td id="probC_ssr">-</td>
          <td id="probC_rare">-</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h2>操作紀錄</h2>
    <div class="log" id="log"></div>
  </div>

  <script>
    // -------- 狀態變數 --------
    let pos = 0;         // 目前格子
    let steps = 0;       // 已加工次數
    let bLeft = 3;       // B 剩餘次數
    let cLeft = 3;       // C 剩餘次數
    const MAX_STEPS = 8;

    // memo 用來做動態規劃的記憶（避免重複計算）
    const memo = new Map();

    // -------- 工具函式 --------
    function clampToZero(x) {
      return x < 0 ? 0 : x;
    }

    function randInt(min, max) {
      // 含 min, 含 max
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function tierFromPos(p) {
      if (p >= 16) return "爆炸（稀有）";
      if (p === 15) return "史詩";
      if (p >= 10 && p <= 12) return "超級稀有";
      return "稀有";
    }

    function formatTierWithBadge(tier) {
      if (tier === "史詩") {
        return tier + ' <span class="badge badge-epic">最佳</span>';
      } else if (tier === "超級稀有") {
        return tier + ' <span class="badge badge-ssr">次佳</span>';
      } else {
        return tier + ' <span class="badge badge-rare">一般</span>';
      }
    }

    // -------- 評估某個狀態下的期望結果（動態規劃） --------
    // 回傳 {pEpic, pSSR, pRare}
    function evaluateState(pos, steps, bLeft, cLeft) {
      // 終止條件：已經爆炸或已用完 8 次
      if (pos >= 16 || steps >= MAX_STEPS) {
        let pEpic = 0, pSSR = 0, pRare = 0;
        if (pos >= 16) {
          // 爆炸 => 稀有
          pRare = 1;
        } else if (pos === 15) {
          pEpic = 1;
        } else if (pos >= 10 && pos <= 12) {
          pSSR = 1;
        } else {
          pRare = 1;
        }
        return { pEpic, pSSR, pRare };
      }

      const key = pos + "|" + steps + "|" + bLeft + "|" + cLeft;
      if (memo.has(key)) {
        return memo.get(key);
      }

      // 嘗試每個可用按鈕，計算在「之後自己會選最優策略」下的結果
      const candidates = [];

      // 按鈕 A：+3 ~ +6
      candidates.push(evaluateActionFrom(pos, steps, bLeft, cLeft, "A"));

      // 按鈕 B：-3 ~ +2（還有次數才算）
      if (bLeft > 0) {
        candidates.push(evaluateActionFrom(pos, steps, bLeft, cLeft, "B"));
      }

      // 按鈕 C：+0 ~ +4（還有次數才算）
      if (cLeft > 0) {
        candidates.push(evaluateActionFrom(pos, steps, bLeft, cLeft, "C"));
      }

      // 「在這個狀態」我們一定會挑「三個按鈕中最好的那個」
      // 所以整體結果就是這些候選中的「最大值」
      let best = candidates[0];
      for (let i = 1; i < candidates.length; i++) {
        if (isBetter(candidates[i], best)) {
          best = candidates[i];
        }
      }

      memo.set(key, best.result); // 只存結果機率，不存 action
      return best.result;
    }

    // 比較哪個結果較好：先比 pEpic，再比 pSSR，再比 pRare
    function isBetter(a, b) {
      if (a.result.pEpic !== b.result.pEpic) {
        return a.result.pEpic > b.result.pEpic;
      }
      if (a.result.pSSR !== b.result.pSSR) {
        return a.result.pSSR > b.result.pSSR;
      }
      return a.result.pRare > b.result.pRare;
    }

    // 從某個狀態出發，指定按鈕 action，考慮隨機與之後最佳策略
    // 回傳 {action, result:{pEpic,pSSR,pRare}}
    function evaluateActionFrom(pos, steps, bLeft, cLeft, action) {
      let deltas = [];
      if (action === "A") {
        // +3 ~ +6，4 種等機率
        deltas = [3, 4, 5, 6];
      } else if (action === "B") {
        // -3 ~ +2，6 種等機率
        deltas = [-3, -2, -1, 0, 1, 2];
      } else if (action === "C") {
        // +0 ~ +4，5 種等機率
        deltas = [0, 1, 2, 3, 4];
      }

      const prob = 1 / deltas.length;
      let sumEpic = 0, sumSSR = 0, sumRare = 0;

      for (const d of deltas) {
        let newPos = pos + d;
        if (action === "B") {
          newPos = clampToZero(newPos); // 不會小於 0
        }
        const newSteps = steps + 1;
        let nextBLeft = bLeft;
        let nextCLeft = cLeft;
        if (action === "B") nextBLeft--;
        if (action === "C") nextCLeft--;

        const sub = evaluateState(newPos, newSteps, nextBLeft, nextCLeft);
        sumEpic += sub.pEpic * prob;
        sumSSR += sub.pSSR * prob;
        sumRare += sub.pRare * prob;
      }

      return {
        action,
        result: {
          pEpic: sumEpic,
          pSSR: sumSSR,
          pRare: sumRare
        }
      };
    }

    // 給目前狀態，選出「最佳按鈕」，並計算三個按鈕的機率
    function getBestActionAndAllProbs(pos, steps, bLeft, cLeft) {
      memo.clear(); // 每次重新算，保險起見

      const actions = [];

      const aRes = evaluateActionFrom(pos, steps, bLeft, cLeft, "A");
      actions.push(aRes);

      let bRes = null;
      if (bLeft > 0) {
        bRes = evaluateActionFrom(pos, steps, bLeft, cLeft, "B");
        actions.push(bRes);
      }

      let cRes = null;
      if (cLeft > 0) {
        cRes = evaluateActionFrom(pos, steps, bLeft, cLeft, "C");
        actions.push(cRes);
      }

      let best = actions[0];
      for (let i = 1; i < actions.length; i++) {
        if (isBetter(actions[i], best)) {
          best = actions[i];
        }
      }

      return {
        bestAction: best.action,
        A: aRes.result,
        B: bRes ? bRes.result : null,
        C: cRes ? cRes.result : null
      };
    }

    // -------- UI 更新 --------
    function updateUI() {
      document.getElementById("pos").textContent = pos;
      document.getElementById("steps").textContent = steps;
      document.getElementById("bLeft").textContent = bLeft;
      document.getElementById("cLeft").textContent = cLeft;

      const tier = tierFromPos(pos);
      document.getElementById("currentTier").innerHTML = formatTierWithBadge(tier);

      const btnA = document.getElementById("btnA");
      const btnB = document.getElementById("btnB");
      const btnC = document.getElementById("btnC");

      const gameEnded = (pos >= 16 || steps >= MAX_STEPS);

      btnA.disabled = gameEnded;
      btnB.disabled = gameEnded || bLeft <= 0;
      btnC.disabled = gameEnded || cLeft <= 0;

      if (gameEnded) {
        document.getElementById("recommendation").innerHTML =
          "遊戲已結束，最終結果：" + formatTierWithBadge(tier) +
          `（格子：${pos}，共加工 ${steps} 次）`;
        // 機率表清掉
        updateProbTable(null);
        return;
      }

      // 尚未結束 => 計算推薦
      const advice = getBestActionAndAllProbs(pos, steps, bLeft, cLeft);
      const bestLabel = advice.bestAction === "A" ? "按鈕 A（+3~+6）"
                        : advice.bestAction === "B" ? "按鈕 B（-3~+2）"
                        : "按鈕 C（+0~+4）";

      document.getElementById("recommendation").innerHTML =
        `目前推薦：<strong>${bestLabel}</strong><br/>
        （優先最大化 <strong>史詩機率</strong>，其後是 <strong>超級稀有機率</strong>）`;

      updateProbTable(advice);
    }

    function toPercent(x) {
      return (x * 100).toFixed(1) + "%";
    }

    function updateProbTable(advice) {
      const fields = [
        ["A", "probA_epic", "probA_ssr", "probA_rare"],
        ["B", "probB_epic", "probB_ssr", "probB_rare"],
        ["C", "probC_epic", "probC_ssr", "probC_rare"]
      ];

      if (!advice) {
        // 清空
        for (const [, e, s, r] of fields) {
          document.getElementById(e).textContent = "-";
          document.getElementById(s).textContent = "-";
          document.getElementById(r).textContent = "-";
        }
        return;
      }

      function fillRow(key, ids) {
        const res = advice[key];
        const [epicId, ssrId, rareId] = ids;
        if (!res) {
          document.getElementById(epicId).textContent = "無法使用";
          document.getElementById(ssrId).textContent = "-";
          document.getElementById(rareId).textContent = "-";
          return;
        }
        document.getElementById(epicId).textContent = toPercent(res.pEpic);
        document.getElementById(ssrId).textContent = toPercent(res.pSSR);
        document.getElementById(rareId).textContent = toPercent(res.pRare);
      }

      fillRow("A", ["probA_epic", "probA_ssr", "probA_rare"]);
      fillRow("B", ["probB_epic", "probB_ssr", "probB_rare"]);
      fillRow("C", ["probC_epic", "probC_ssr", "probC_rare"]);
    }

    function appendLog(text) {
      const log = document.getElementById("log");
      const line = document.createElement("div");
      line.textContent = text;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    }

    function resetGame() {
      pos = 0;
      steps = 0;
      bLeft = 3;
      cLeft = 3;
      document.getElementById("log").innerHTML = "";
      appendLog("已重置遊戲。");
      updateUI();
    }

    // -------- 按鈕事件 --------
    document.getElementById("btnA").addEventListener("click", () => {
      if (steps >= MAX_STEPS || pos >= 16) return;
      const d = randInt(3, 6);
      pos += d;
      steps++;
      appendLog(`第 ${steps} 次：使用 A，變化 +${d}，現在位置 ${pos}`);
      updateUI();
    });

    document.getElementById("btnB").addEventListener("click", () => {
      if (steps >= MAX_STEPS || pos >= 16 || bLeft <= 0) return;
      const d = randInt(-3, 2);
      const before = pos;
      pos = clampToZero(pos + d);
      steps++;
      bLeft--;
      appendLog(`第 ${steps} 次：使用 B，變化 ${d >= 0 ? "+" + d : d}，位置 ${before} → ${pos}`);
      updateUI();
    });

    document.getElementById("btnC").addEventListener("click", () => {
      if (steps >= MAX_STEPS || pos >= 16 || cLeft <= 0) return;
      const d = randInt(0, 4);
      pos += d;
      steps++;
      cLeft--;
      appendLog(`第 ${steps} 次：使用 C，變化 +${d}，現在位置 ${pos}`);
      updateUI();
    });

    document.getElementById("resetBtn").addEventListener("click", resetGame);

    // 初始
    resetGame();
  </script>
</body>
</html>
